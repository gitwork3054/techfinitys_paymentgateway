databases:
  - name: techfinitys-payment-db
    plan: free
    databaseName: techfinitys_payment
    user: techfinitys_payment

services:
  - type: web
    name: techfinitys-paymentgateway
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py ensure_client && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techfinitys-payment-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: CLIENT_USERNAME\n        value: ashapurarakhi
      - key: CLIENT_PASSWORD
        sync: false
      - key: CLIENT_COMPANY
        value: Ashapura Rakhi
      - key: CLIENT_CONTACT
        value: Ashapura Rakhi
      - key: CLIENT_PHONE
        value: "8401947462"
      - key: CLIENT_ADDRESS
        value: Opposite Old Laxmipura Police Station, Laxmipura Road, Vadodara, Gujarat
      - key: CLIENT_PROJECT
        value: Billing Suite
      - key: CLIENT_PLAN
        value: Premium Brand Growth Plan
      - key: CLIENT_YEARLY_AMOUNT
        value: "300000"
      - key: CLIENT_DUE_DATE
        value: "2026-12-28"
      - key: CASHFREE_ENV
        value: sandbox
      - key: PAYMENT_PROVIDER
        value: UPI Gateway
