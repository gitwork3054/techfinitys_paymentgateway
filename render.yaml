databases:
  - name: techfinitys-payment-db
    plan: free
    databaseName: techfinitys_payment
    user: techfinitys_payment

services:
  - type: web
    name: techfinitys-paymentgateway
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py ensure_admin && python manage.py ensure_client && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techfinitys-payment-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CLIENT_USERNAME
        value: client
      - key: CLIENT_PASSWORD
        sync: false
      - key: CLIENT_COMPANY
        value: Aarav Industries Pvt Ltd
      - key: CLIENT_CONTACT
        value: Aarav Mehta
      - key: CLIENT_PROJECT
        value: ERP & Inventory Suite
      - key: CLIENT_PLAN
        value: Enterprise Annual
      - key: CLIENT_YEARLY_AMOUNT
        value: "400000"
      - key: CLIENT_DUE_DATE
        value: "2026-12-31"
      - key: CASHFREE_ENV
        value: sandbox
      - key: PAYMENT_PROVIDER
        value: Cashfree
