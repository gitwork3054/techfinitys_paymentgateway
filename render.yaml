databases:
  - name: techfinitys-payment-db
    plan: free
    databaseName: techfinitys_payment
    user: techfinitys_payment

services:
  - type: web
    name: techfinitys-paymentgateway
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py ensure_admin && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techfinitys-payment-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: PAYMENT_PROVIDER
        value: Cashfree
